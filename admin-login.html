<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CityCare — Operator Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white max-w-sm w-full rounded-3xl shadow-xl border border-slate-100 p-8">
      <h1 class="text-2xl font-extrabold text-slate-900 mb-1">Operator Login</h1>
      <p class="text-sm text-slate-500 mb-6">CityCare Diagnostic Center — Staff Access</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Username</label>
          <input type="text" id="username" required autocomplete="username"
            class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:border-sky-500 outline-none" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
          <input type="password" id="password" required autocomplete="current-password"
            class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:border-sky-500 outline-none" />
        </div>

        <button type="submit" id="submit-btn"
          class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl transition-all">
          Log In
        </button>
      </form>

      <!-- Error box -->
      <div id="error-box" class="hidden mt-6 bg-rose-50 border border-rose-100 p-4 rounded-xl">
        <p id="error-text" class="text-xs text-rose-600"></p>
      </div>
    </div>

    <script>
      const form = document.getElementById("login-form");
      const errorBox = document.getElementById("error-box");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.classList.add("hidden");
        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        try {
          const response = await fetch("/citycare/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value,
              password: document.getElementById("password").value,
            }),
          });
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Login failed.");
          }

          // Success — go to the dashboard form
          window.location.href = "/citycare/admin-dashboard.html";
        } catch (err) {
          document.getElementById("error-text").textContent = err.message;
          errorBox.classList.remove("hidden");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Log In";
        }
      });
    </script>
  </body>
</html>
